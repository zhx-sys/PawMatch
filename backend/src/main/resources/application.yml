server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/pawmatch?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      continue-on-error: true
      schema-locations: classpath:schema.sql
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

app:
  upload:
    path: ./uploads

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: PawMatchSecretKeyForJWTTokenGeneration2026MustBeAtLeast256BitsLong
  expiration: 86400000
